[package]
name = "pcb-kicad-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Measurement tools for KiCad boards that the research and benchmark commands run; not on any agent command's path"
publish = false

[dependencies]
pcb-global = { path = "../pcb-global" }
pcb-kicad = { path = "../pcb-kicad" }
pcb-kicad-file = { path = "../pcb-kicad-file" }
pcb-kicad-place = { path = "../pcb-kicad-place" }
pcb-kicad-route = { path = "../pcb-kicad-route" }
pcb-placer = { path = "../pcb-placer" }
pcb-router = { path = "../pcb-router" }
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
# Candidate coordinates must parse identically in standalone library consumers
# and the main executable, without relying on workspace feature unification.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
