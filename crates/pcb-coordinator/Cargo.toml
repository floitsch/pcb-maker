[package]
name = "pcb-coordinator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Transactional placement/routing experiment coordinators for pcb-maker"
publish = false

[dependencies]
layout-trace-model = { path = "../layout-trace-model" }
pcb-placement = { path = "../pcb-placement" }
pcb-routing = { path = "../pcb-routing" }
pcb-validate = { path = "../pcb-validate" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
