[package]
name = "pcb-kicad-place"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A KiCad board placed: the lowering to pcb-placer's problem, the place flow, placement constraints, panels, labels"
publish = false

[dependencies]
pcb-global = { path = "../pcb-global" }
pcb-kicad-check = { path = "../pcb-kicad-check" }
pcb-kicad-file = { path = "../pcb-kicad-file" }
pcb-kicad-route = { path = "../pcb-kicad-route" }
pcb-placer = { path = "../pcb-placer" }
pcb-router = { path = "../pcb-router" }
pcb-topo = { path = "../pcb-topo" }
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
# Candidate coordinates must parse identically in standalone library consumers
# and the main executable, without relying on workspace feature unification.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
