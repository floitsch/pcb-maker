[package]
name = "pcb-kicad"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic KiCad project materialization for pcb-maker experiments"
publish = false

[dependencies]
layout-trace-model = { path = "../layout-trace-model" }
pcb-core = { path = "../pcb-core" }
pcb-engine = { path = "../pcb-engine" }
pcb-grid-router = { path = "../pcb-grid-router" }
pcb-router = { path = "../pcb-router" }
serde = { version = "1.0", features = ["derive"] }
# Candidate coordinates must parse identically in standalone library consumers
# and the main executable, without relying on workspace feature unification.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
