[package]
name = "pcb-kicad"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic KiCad project materialization for pcb-maker experiments"
publish = false

[dependencies]
pcb-congestion = { path = "../pcb-congestion" }
pcb-global = { path = "../pcb-global" }
pcb-placer = { path = "../pcb-placer" }
pcb-router = { path = "../pcb-router" }
pcb-topo = { path = "../pcb-topo" }
rayon = "1"
# Net class patterns are regular expressions as well as wildcards.
regex-lite = "0.1"
serde = { version = "1.0", features = ["derive"] }
# Candidate coordinates must parse identically in standalone library consumers
# and the main executable, without relying on workspace feature unification.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# kicad-cli dies with the router (prctl PR_SET_PDEATHSIG, Linux only);
# RLIMIT_AS bounds the router's memory (getrlimit, every Unix: the macOS
# release build needs it).
libc = "0.2"
