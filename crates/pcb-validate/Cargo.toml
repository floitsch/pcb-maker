[package]
name = "pcb-validate"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Independent exact validation for PCB placement and routing candidates"

[dependencies]
layout-trace-model = { path = "../layout-trace-model" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }

