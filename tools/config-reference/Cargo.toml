[package]
name = "config-reference"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generates docs/config-reference.md and the hand-over's environment index from the config structs and the code"
publish = false

[dependencies]
pcb-kicad = { path = "../../crates/pcb-kicad" }
pcb-placer = { path = "../../crates/pcb-placer" }
pcb-router = { path = "../../crates/pcb-router" }
serde = "1.0"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
