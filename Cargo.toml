[package]
name = "pcb-maker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "GPU-first experiments in coupled PCB placement and routing"

[workspace]
members = [
    ".",
    "crates/pcb-kicad",
    "crates/pcb-placer",
    "crates/pcb-router",
    "crates/pcb-congestion",
    "crates/pcb-topo",
    "tools/config-reference",
]
resolver = "3"

[dependencies]
pcb-kicad = { path = "crates/pcb-kicad" }
serde = "1.0"
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[dev-dependencies]
config-reference = { path = "tools/config-reference" }
