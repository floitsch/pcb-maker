[package]
name = "pcb-maker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A placer and router for KiCad boards, driven by agents"

[workspace]
members = [
    ".",
    "crates/pcb-kicad",
    "crates/pcb-kicad-file",
    "crates/pcb-kicad-check",
    "crates/pcb-kicad-route",
    "crates/pcb-kicad-place",
    "crates/pcb-kicad-import",
    "crates/pcb-kicad-lab",
    "crates/pcb-placer",
    "crates/pcb-router",
    "crates/pcb-global",
    "crates/pcb-topo",
    "tools/config-reference",
]
resolver = "3"

[dependencies]
pcb-kicad = { path = "crates/pcb-kicad" }
pcb-kicad-import = { path = "crates/pcb-kicad-import" }
pcb-kicad-lab = { path = "crates/pcb-kicad-lab" }
serde = "1.0"
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[dev-dependencies]
config-reference = { path = "tools/config-reference" }
