name: check

# The gate on every push and pull request: scripts/check.sh --fast (the
# unit tests of every crate, the CLI tests, the fixture tests on
# tests/fixtures, the Python tests, workspace clippy, a release build) and
# rustfmt. Every night (and on demand): scripts/check.sh --full with KiCad
# 10 installed, so that the tests that need kicad-cli run (the agent
# walkthrough, the fixture tests of KiCad's connectivity and pours, the
# CLI test's KiCad case) and the slow placer tests.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: tests and build (fast gate)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python test tools
        run: python -m pip install pytest
      - name: scripts/check.sh --fast
        # No kicad-cli on GitHub's runners: the KiCad tests say so and
        # pass; the nightly job runs them.
        run: bash scripts/check.sh --fast

  lint:
    name: rustfmt
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all --check

  nightly:
    name: everything, with KiCad 10 (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad
          kicad-cli version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python test tools
        run: python -m pip install pytest
      - name: scripts/check.sh --full
        run: bash scripts/check.sh --full
